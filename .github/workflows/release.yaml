name: Test, format and publish to crates.io

on:
  push:
    branches: [master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Swatinem/rust-cache@v2.9.2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: rustup toolchain install 1.88.0 --profile minimal --no-self-update
      - run: cargo +1.88.0 check --locked

  format:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v7.0.1
      - run: rustup toolchain install nightly --profile minimal --component rustfmt --no-self-update
      - run: cargo fmt --check

  publish:
    needs: [test, format]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - run: test "v$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')" = "$GITHUB_REF_NAME"
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4.9.1
        id: changelog
        with:
          args: --latest --strip all
        env:
          GITHUB_REPO: ${{ github.repository }}
      - uses: softprops/action-gh-release@v3.0.3
        with:
          body: ${{ steps.changelog.outputs.content }}

  binaries:
    needs: release
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: taiki-e/upload-rust-binary-action@v1.30.2
        with:
          bin: baoenv
          target: ${{ matrix.target }}
          checksum: sha256
